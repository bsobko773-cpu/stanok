<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Живий Трекер Тиску</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Плавний скроллбар */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Розмиття фону для модального вікна */
        dialog::backdrop { 
            background: rgba(15, 23, 42, 0.3); 
            backdrop-filter: blur(4px); 
            animation: fadeIn 0.3s ease-out;
        }

        /* Анімації появи рядків (Каскадний ефект) */
        @keyframes slideInUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-row {
            opacity: 0;
            animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Скляний ефект для карток */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 font-sans text-slate-800 min-h-screen p-4 sm:p-8 selection:bg-indigo-100 selection:text-indigo-900">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Верхня панель (Заголовок, Серія та Поради) -->
        <header class="glass-card shadow-sm rounded-3xl p-6 md:p-8 flex flex-col md:flex-row justify-between items-stretch md:items-center gap-6 transition-all duration-300 hover:shadow-md">
            <div>
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-700 to-sky-600 mb-2">
                    🩺 Трекер Тиску
                </h1>
                <div class="flex items-center gap-3">
                    <span class="bg-orange-100 text-orange-700 font-bold px-3 py-1 rounded-full text-sm flex items-center gap-1 shadow-sm transition-transform hover:scale-105 cursor-default">
                        🔥 Серія: <span id="streak-counter">0</span> днів
                    </span>
                    <p class="text-sm text-slate-500 font-medium">Річний план моніторингу</p>
                </div>
            </div>

            <!-- Віджет поради -->
            <div class="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-4 flex-1 max-w-md cursor-pointer hover:bg-indigo-50 transition-colors" onclick="nextTip()">
                <div class="flex items-start gap-3">
                    <div class="text-indigo-500 text-xl">💡</div>
                    <div>
                        <h4 class="text-xs font-bold text-indigo-700 uppercase tracking-wide mb-1">Порада дня (Натисни)</h4>
                        <p id="health-tip" class="text-sm text-slate-600 font-medium leading-tight transition-opacity duration-300"></p>
                    </div>
                </div>
            </div>

            <!-- Кнопки Імпорт/Експорт -->
            <div class="flex gap-2">
                <button onclick="exportJSON()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-4 py-2.5 rounded-xl font-semibold transition-all duration-200 active:scale-95 shadow-sm flex items-center gap-2 text-sm hover:shadow">
                    📥 Експорт
                </button>
                <label class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-semibold transition-all duration-200 active:scale-95 shadow-md shadow-indigo-200 flex items-center gap-2 text-sm cursor-pointer hover:shadow-lg">
                    📤 Імпорт
                    <input type="file" id="import-file" class="hidden" accept=".json" onchange="importJSON(event)">
                </label>
            </div>
        </header>

        <!-- Навігація по місяцях (Горизонтальний скрол) -->
        <div class="glass-card p-2 rounded-2xl shadow-sm flex overflow-x-auto gap-2" id="month-selector">
            <!-- Кнопки генеруються скриптом -->
        </div>

        <!-- Головна Таблиця -->
        <main class="glass-card shadow-sm rounded-3xl overflow-hidden transition-all duration-500">
            <div class="p-6 border-b border-slate-100/50 flex justify-between items-center bg-white/50">
                <h2 id="current-month-title" class="text-xl font-bold text-slate-800 tracking-tight">Місяць</h2>
                <div class="text-sm font-semibold text-indigo-700 bg-indigo-50 px-4 py-1.5 rounded-full shadow-inner border border-indigo-100/50">
                    Статистика: <span id="month-stats">-</span>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="p-4 font-bold w-24">Дата</th>
                            <th class="p-4 font-bold w-1/3">☀️ Ранок</th>
                            <th class="p-4 font-bold w-1/3">🌙 Вечір</th>
                            <th class="p-4 font-bold">ℹ️ Аналітика</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body" class="divide-y divide-slate-100/60 text-sm">
                        <!-- Дні -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Модальне вікно (Анімоване) -->
    <dialog id="entry-modal" class="rounded-3xl shadow-2xl border border-slate-100 p-0 w-full max-w-sm transition-all">
        <div class="p-6 bg-white">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="text-xl font-extrabold text-slate-800" id="modal-title">Додати вимір</h3>
                    <p class="text-xs text-slate-500 font-medium mt-1" id="modal-subtitle">Дата</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 bg-slate-50 hover:bg-slate-100 p-2 rounded-full transition-colors">
                    ✕
                </button>
            </div>
            
            <form id="entry-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="relative group">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Верхній</label>
                        <input type="number" id="sys-input" required max="250" min="50" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-bold text-lg text-slate-800 group-hover:border-indigo-300">
                    </div>
                    <div class="relative group">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Нижній</label>
                        <input type="number" id="dia-input" required max="150" min="30" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-bold text-lg text-slate-800 group-hover:border-indigo-300">
                    </div>
                </div>
                <div class="relative group">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Пульс</label>
                    <input type="number" id="pulse-input" required max="200" min="30" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition-all font-bold text-lg text-slate-800 group-hover:border-sky-300">
                </div>
                <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100 cursor-pointer hover:bg-slate-100 transition-colors" onclick="document.getElementById('meds-input').click()">
                    <input type="checkbox" id="meds-input" class="w-5 h-5 text-indigo-600 rounded-md border-slate-300 accent-indigo-600" onclick="event.stopPropagation()">
                    <label class="text-sm font-bold text-slate-700 cursor-pointer">Прийняв ліки 💊</label>
                </div>
                
                <div class="pt-4 flex flex-col gap-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-bold py-3.5 px-4 rounded-xl transition-all duration-200 shadow-md shadow-indigo-200 active:scale-95 flex justify-center items-center gap-2">
                        <span>Зберегти запис</span> ✨
                    </button>
                    <button type="button" id="delete-btn" class="w-full text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 font-bold py-3 px-4 rounded-xl transition-all duration-200 hidden">
                        Видалити
                    </button>
                </div>
            </form>
        </div>
    </dialog>

    <script>
        const DB_KEY = 'year_bp_tracker_db_v2';
        let bpData = JSON.parse(localStorage.getItem(DB_KEY)) || {};
        
        // --- ЛОГІКА ДАТ: Від сьогодні на 1 рік вперед ---
        const today = new Date();
        today.setHours(0, 0, 0, 0); // Обнуляємо час для точного порівняння
        
        const endDate = new Date(today);
        endDate.setFullYear(endDate.getFullYear() + 1);

        const uaMonths = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
        
        // Генеруємо масив доступних місяців від сьогодні до +1 рік
        let monthTabs = [];
        let curr = new Date(today.getFullYear(), today.getMonth(), 1);
        const endMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
        
        while (curr <= endMonth) {
            monthTabs.push({
                year: curr.getFullYear(),
                month: curr.getMonth(),
                label: `${uaMonths[curr.getMonth()]} ${curr.getFullYear()}`
            });
            curr.setMonth(curr.getMonth() + 1);
        }

        let currentTabIndex = 0; // За замовчуванням перший (поточний) місяць

        // --- МОТИВАЦІЙНІ ПОРАДИ ---
        const tips = [
            "Пий більше чистої води — це допомагає підтримувати нормальний об'єм крові.",
            "Стрес підвищує тиск. Спробуй дихальну гімнастику (вдих на 4, видих на 4).",
            "Регулярні прогулянки на свіжому повітрі зміцнюють стінки судин.",
            "Зменш споживання солі до 5 грамів на день.",
            "Вимірюй тиск у спокійному стані, посидівши хоча б 5 хвилин.",
            "Кава може тимчасово підвищувати тиск, не пий її за годину до вимірювання."
        ];

        function nextTip() {
            const tipEl = document.getElementById('health-tip');
            tipEl.style.opacity = '0';
            setTimeout(() => {
                const randomTip = tips[Math.floor(Math.random() * tips.length)];
                tipEl.innerText = randomTip;
                tipEl.style.opacity = '1';
            }, 300);
        }

        // --- ІНІЦІАЛІЗАЦІЯ ---
        function init() {
            nextTip();
            calculateStreak();
            renderMonthSelector();
            renderCalendar(currentTabIndex);
        }

        function calculateStreak() {
            let streak = 0;
            let checkDate = new Date(today);
            
            // Йдемо назад від сьогодні і рахуємо дні з даними
            while (true) {
                const dateStr = checkDate.toISOString().split('T')[0];
                if (bpData[dateStr] && (bpData[dateStr].morning || bpData[dateStr].evening)) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
            document.getElementById('streak-counter').innerText = streak;
        }

        // --- РЕНДЕР ІНТЕРФЕЙСУ ---
        function renderMonthSelector() {
            const container = document.getElementById('month-selector');
            container.innerHTML = '';
            
            monthTabs.forEach((tab, index) => {
                const btn = document.createElement('button');
                const isActive = index === currentTabIndex;
                btn.className = `px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 whitespace-nowrap border ${
                    isActive 
                    ? 'bg-slate-800 text-white shadow-md border-slate-800 transform scale-105 mx-1' 
                    : 'bg-white text-slate-500 hover:bg-slate-50 hover:text-slate-800 border-slate-100'
                }`;
                btn.innerText = tab.label;
                btn.onclick = () => {
                    currentTabIndex = index;
                    renderMonthSelector();
                    renderCalendar(currentTabIndex);
                };
                container.appendChild(btn);
            });
        }

        function renderCalendar(tabIndex) {
            const tab = monthTabs[tabIndex];
            document.getElementById('current-month-title').innerText = tab.label;
            const tbody = document.getElementById('calendar-body');
            tbody.innerHTML = '';

            const daysInMonth = new Date(tab.year, tab.month + 1, 0).getDate();
            let monthSysSum = 0, monthDiaSum = 0, count = 0;
            let rowAnimDelay = 0;

            for (let day = 1; day <= daysInMonth; day++) {
                const iterDate = new Date(tab.year, tab.month, day);
                iterDate.setHours(0, 0, 0, 0);

                // Відображаємо тільки дні між сьогодні та "сьогодні + 1 рік"
                if (iterDate < today || iterDate > endDate) continue;

                // Форматування для збереження YYYY-MM-DD з урахуванням локального часу
                const dateStr = `${tab.year}-${String(tab.month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayData = bpData[dateStr] || { morning: null, evening: null };

                if (dayData.morning) { monthSysSum += dayData.morning.sys; monthDiaSum += dayData.morning.dia; count++; }
                if (dayData.evening) { monthSysSum += dayData.evening.sys; monthDiaSum += dayData.evening.dia; count++; }

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-indigo-50/30 transition-colors group animate-row border-b border-slate-100/50';
                tr.style.animationDelay = `${rowAnimDelay}ms`;
                rowAnimDelay += 30; // Каскадна затримка

                // Визначаємо сьогоднішній день для підсвітки
                const isToday = iterDate.getTime() === today.getTime();
                const dayBadge = isToday ? `<div class="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-full mt-1 font-bold inline-block">Сьогодні</div>` : '';

                tr.innerHTML = `
                    <td class="p-4 align-top w-24">
                        <div class="font-extrabold text-lg ${isToday ? 'text-indigo-600' : 'text-slate-700'}">${day}</div>
                        <div class="text-xs text-slate-400 font-medium uppercase">${iterDate.toLocaleDateString('uk-UA', {weekday: 'short'})}</div>
                        ${dayBadge}
                    </td>
                    <td class="p-2 h-full align-top border-l border-slate-100/60">${createCellUI(dateStr, 'morning', dayData.morning)}</td>
                    <td class="p-2 h-full align-top border-l border-slate-100/60">${createCellUI(dateStr, 'evening', dayData.evening)}</td>
                    <td class="p-4 align-middle bg-slate-50/30">${generateDayAnalytics(dayData)}</td>
                `;
                tbody.appendChild(tr);
            }

            const statsEl = document.getElementById('month-stats');
            statsEl.innerText = count > 0 ? `Середній ${Math.round(monthSysSum/count)}/${Math.round(monthDiaSum/count)}` : "Немає даних";
        }

        function createCellUI(dateStr, period, data) {
            const periodName = period === 'morning' ? 'ранок' : 'вечір';
            if (!data) {
                return `<div onclick="openModal('${dateStr}', '${period}')" class="h-full min-h-[80px] w-full p-3 rounded-2xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center cursor-pointer text-slate-300 hover:border-indigo-300 hover:text-indigo-500 hover:bg-indigo-50/50 transition-all duration-300 active:scale-95 group">
                    <span class="text-xl group-hover:scale-125 transition-transform">+</span>
                    <span class="text-[10px] font-bold uppercase mt-1 opacity-0 group-hover:opacity-100 transition-opacity">Внести ${periodName}</span>
                </div>`;
            }

            const status = evaluateBP(data.sys, data.dia);
            const medsIcon = data.meds ? '<span class="bg-indigo-100 text-indigo-700 p-1 rounded-md text-xs shadow-sm">💊</span>' : '';

            return `
                <div onclick="openModal('${dateStr}', '${period}')" class="h-full w-full p-3 bg-white border border-slate-100 rounded-2xl cursor-pointer hover:shadow-md hover:-translate-y-1 hover:border-indigo-200 transition-all duration-300 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-black text-xl text-slate-800">${data.sys}<span class="text-slate-400 font-medium text-lg">/</span>${data.dia}</span>
                            ${medsIcon}
                        </div>
                        <span class="inline-block text-[10px] px-2 py-1 rounded-md font-bold uppercase tracking-wider ${status.bg} ${status.text}">${status.label}</span>
                    </div>
                    <div class="text-xs font-bold text-slate-400 mt-3 flex items-center gap-1 bg-slate-50 p-1.5 rounded-lg w-max">
                        <span class="text-red-400">❤</span> ${data.pulse} уд/хв
                    </div>
                </div>
            `;
        }

        // --- АНАЛІТИКА ТА МОДАЛКА ---
        function evaluateBP(sys, dia) {
            if (sys < 120 && dia < 80) return { label: 'Норма', bg: 'bg-emerald-100/80', text: 'text-emerald-700' };
            if (sys <= 129 && dia < 80) return { label: 'Підвищений', bg: 'bg-amber-100/80', text: 'text-amber-700' };
            if (sys <= 139 || dia <= 89) return { label: 'Гіпертонія I', bg: 'bg-orange-100/80', text: 'text-orange-700' };
            return { label: 'Гіпертонія II+', bg: 'bg-red-100/80', text: 'text-red-700' };
        }

        function generateDayAnalytics(dayData) {
            if (!dayData.morning && !dayData.evening) return `<span class="text-[11px] font-bold text-slate-300 uppercase">Дані відсутні</span>`;
            
            let avgSys = 0, avgDia = 0, items = 0;
            if (dayData.morning) { avgSys += dayData.morning.sys; avgDia += dayData.morning.dia; items++; }
            if (dayData.evening) { avgSys += dayData.evening.sys; avgDia += dayData.evening.dia; items++; }
            
            avgSys = Math.round(avgSys / items);
            avgDia = Math.round(avgDia / items);
            const pp = avgSys - avgDia;
            
            let ppStatus = '';
            if (pp > 60) ppStatus = `<span class="text-[10px] bg-red-50 text-red-600 px-2 py-1 rounded-md font-bold">⚠️ В. різниця (${pp})</span>`;
            else if (pp < 30) ppStatus = `<span class="text-[10px] bg-orange-50 text-orange-600 px-2 py-1 rounded-md font-bold">⚠️ М. різниця (${pp})</span>`;
            else ppStatus = `<span class="text-[10px] bg-emerald-50 text-emerald-600 px-2 py-1 rounded-md font-bold">✅ Норма (${pp})</span>`;

            return `
                <div class="flex flex-col gap-2">
                    <div class="text-sm font-extrabold text-slate-600">Сер: ${avgSys}/${avgDia}</div>
                    ${ppStatus}
                </div>
            `;
        }

        const modal = document.getElementById('entry-modal');
        let activeEditDate = null;
        let activeEditPeriod = null;

        function openModal(dateStr, period) {
            activeEditDate = dateStr;
            activeEditPeriod = period;
            
            const displayDate = new Date(dateStr).toLocaleDateString('uk-UA', {day: 'numeric', month: 'long', year: 'numeric'});
            document.getElementById('modal-title').innerText = period === 'morning' ? '🌅 Ранковий вимір' : '🌃 Вечірній вимір';
            document.getElementById('modal-subtitle').innerText = displayDate;
            
            const existing = bpData[dateStr] && bpData[dateStr][period];
            if (existing) {
                document.getElementById('sys-input').value = existing.sys;
                document.getElementById('dia-input').value = existing.dia;
                document.getElementById('pulse-input').value = existing.pulse;
                document.getElementById('meds-input').checked = existing.meds;
                document.getElementById('delete-btn').classList.remove('hidden');
            } else {
                document.getElementById('entry-form').reset();
                document.getElementById('delete-btn').classList.add('hidden');
                
                // Підставляємо середні значення для зручності
                document.getElementById('sys-input').value = '120';
                document.getElementById('dia-input').value = '80';
                document.getElementById('pulse-input').value = '70';
            }
            modal.showModal();
        }

        function closeModal() {
            modal.close();
        }

        document.getElementById('entry-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (!bpData[activeEditDate]) bpData[activeEditDate] = { morning: null, evening: null };

            bpData[activeEditDate][activeEditPeriod] = {
                sys: parseInt(document.getElementById('sys-input').value),
                dia: parseInt(document.getElementById('dia-input').value),
                pulse: parseInt(document.getElementById('pulse-input').value),
                meds: document.getElementById('meds-input').checked
            };

            saveData();
            closeModal();
            renderCalendar(currentTabIndex);
            calculateStreak();
        });

        document.getElementById('delete-btn').addEventListener('click', () => {
            bpData[activeEditDate][activeEditPeriod] = null;
            if (!bpData[activeEditDate].morning && !bpData[activeEditDate].evening) delete bpData[activeEditDate];
            saveData();
            closeModal();
            renderCalendar(currentTabIndex);
            calculateStreak();
        });

        function saveData() { localStorage.setItem(DB_KEY, JSON.stringify(bpData)); }

        // --- ІМПОРТ / ЕКСПОРТ ---
        function exportJSON() {
            const blob = new Blob([JSON.stringify(bpData, null, 2)], { type: "application/json" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `BP_Backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    bpData = JSON.parse(e.target.result);
                    saveData();
                    init(); // Перезапуск
                    alert('Базу даних успішно відновлено!');
                } catch (err) { alert('Помилка файлу.'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        init();
    </script>
</body>
</html>
