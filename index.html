<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SO2 GOLD UPGRADER</title>
    
    <!-- Підключаємо Firebase звичайними тегами, які не блокує CORS -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        body { 
            background-color: #0b0b0e; 
            color: #ffffff; 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            text-align: center; 
            padding: 50px 20px;
            margin: 0;
        }
        .card { 
            background-color: #121216; 
            border: 1px solid #ff7700; 
            border-radius: 16px; 
            padding: 40px 30px; 
            max-width: 420px; 
            margin: 40px auto; 
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.15); 
        }
        h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff9900, #ff5500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { color: #9090a2; font-size: 14px; margin-bottom: 25px; }
        .btn { 
            background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%); 
            color: #000000; 
            border: none; 
            padding: 16px 30px; 
            font-size: 16px; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer; 
            border-radius: 8px; 
            width: 100%; 
            margin-top: 15px; 
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
            transition: all 0.2s ease; 
        }
        .btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.5);
        }
        #game-zone { display: none; }
        .gold-container {
            background-color: #1a1a22;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid #ff9900;
        }
        .gold-count { 
            color: #ffaa00; 
            font-size: 32px; 
            font-weight: 900; 
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.4);
        }
        .btn-logout {
            background: none;
            border: 1px solid #3a3a4a;
            color: #707080;
            font-size: 13px;
            padding: 8px;
            width: auto;
            display: inline-block;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>SO2 UPGRADER</h1>
        
        <div id="login-zone">
            <p>Авторизуйтесь через Google, щоб отримати стартовий баланс</p>
            <button id="login-btn" class="btn">Увійти через Google</button>
        </div>

        <div id="game-zone">
            <p>Вітаємо в грі, <span id="user-name" style="color: #fff; font-weight: bold;">Гравець</span></p>
            <div class="gold-container">
                <span id="balance" class="gold-count">0</span> <span style="color: #ffaa00; font-weight: bold;">G</span>
            </div>
            <button id="upgrade-btn" class="btn">Крутити Апгрейд</button>
            <br>
            <button id="logout-btn" class="btn btn-logout">Вийти з акаунта</button>
        </div>
    </div>

    <script>
        // Твій особистий конфіг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDoSHF1EsKrHmtL6gb4IOnYS0vR3h86xZM",
            authDomain: "://firebaseapp.com",
            projectId: "so2-gold",
            storageBucket: "so2-gold.firebasestorage.app",
            messagingSenderId: "944311935725",
            appId: "1:944311935725:web:c26c3a17543ecb334922e4"
        };

        // Ініціалізація сервісів за сумісним (compat) методом
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const loginZone = document.getElementById('login-zone');
        const gameZone = document.getElementById('game-zone');
        const balanceTxt = document.getElementById('balance');
        const nameTxt = document.getElementById('user-name');

        loginBtn.addEventListener('click', async () => {
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                alert("Помилка авторизації: " + error.message);
            }
        });

        logoutBtn.addEventListener('click', () => auth.signOut());

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                loginZone.style.display = 'none';
                gameZone.style.display = 'block';
                nameTxt.innerText = user.displayName || "Гравець";

                const userRef = db.collection("users").doc(user.uid);
                const userSnap = await userRef.get();

                if (userSnap.exists) {
                    balanceTxt.innerText = userSnap.data().balance;
                } else {
                    await userRef.set({
                        username: user.displayName,
                        balance: 500
                    });
                    balanceTxt.innerText = "500";
                }
            } else {
                loginZone.style.display = 'block';
                gameZone.style.display = 'none';
            }
        });
    </script>
</body>
</html>
